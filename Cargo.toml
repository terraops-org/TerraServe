[package]
name = "terraserve"
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"
description = "Clean-room raster + vector tile engine in Rust (COG / GeoPackage / FlatGeoBuf → WMS / WMTS / TMS / MVT), no GDAL / MapServer / GeoServer."
repository = "https://github.com/terraops-org/TerraServe"
readme = "README.md"

# The Python bindings crate (bindings/python) is EXCLUDED from this workspace so a plain
# `cargo build` / score.sh never builds it, nor unifies its vendored-PROJ feature into the
# server build. maturin builds it standalone against a path dependency on this crate.
[workspace]
exclude = ["bindings/python"]

# Pilot skeleton. The measured agent fills in the implementation bodies.
#
# ALLOWED deps: codec / specialized-correctness / util crates that are NOT the
#   differentiator — flate2 / libdeflate, zstd, zune-jpeg / jpeg-decoder, png,
#   proj4rs / proj (coordinate transforms), bytemuck, ndarray, clap, and similar.
#
# BANNED (score.sh enforces): gdal, georust-gdal, tiff, geotiff, cog, tiff2, or ANY
#   GeoTIFF/COG *reader* crate. The COG container + IFD/tiling + windowed read + warp
#   mechanics + protocol stay bespoke — that is what the pilot measures.

[features]
default = ["jemalloc"]
# jemalloc global allocator. glibc's malloc keeps freed memory in-process (RSS stays at the
# high-water mark, inflating the k8s pod footprint after a big whole-extent request); jemalloc
# returns dirty pages to the OS and is fast under the engine's multithreaded decode/render.
# ON BY DEFAULT (this comment used to claim the opposite). Turn it off with `--no-default-features`.
# Absent entirely on MSVC — see the target table below, and terraops-org/TerraServe#9.
jemalloc = ["dep:tikv-jemallocator"]
# Build PROJ from source (vendored) instead of linking system libproj. OFF by default so the
# server build and score.sh stay on fast system libproj; the Python wheel turns it ON so the
# distributed artifact is self-contained (imports on a host with no libproj installed).
bundled-proj = ["proj/bundled_proj"]

# jemalloc allocator, declared per-TARGET so it is absent on MSVC.
#
# ⚠ NOT a style choice — `tikv-jemalloc-sys` does not build for `x86_64-pc-windows-msvc` ("jemalloc
# support ... is untested", then the build script fails). Because `default = ["jemalloc"]`, a plain
# `cargo build --release` on Windows therefore could not succeed AT ALL. Reported from the wild in
# terraops-org/TerraServe#9 by someone simply trying to build the project.
#
# Under this target table the crate is not in the dependency graph on MSVC — but that ALONE is not
# enough: `jemalloc` is a default feature, and Cargo resolves features independently of per-target
# dependency tables, so `cfg(feature = "jemalloc")` stays true on MSVC even with no crate to satisfy
# it. `main.rs` gates its global-allocator item on
# `cfg(all(feature = "jemalloc", not(target_env = "msvc")))`, not the feature alone — that second
# half is what actually compiles the allocator out on Windows. Every other platform is unchanged and
# keeps jemalloc on by default (it is worth ~23x lower idle RSS; see
# `project-serving-architecture-pmtiles`).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
# Unprefixed so it provides the standard malloc/free symbols + reads MALLOC_CONF. A memory
# allocator, not a COG/GeoTIFF reader — allowed by the banned-crate gate.
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"], optional = true }

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
png = "0.17"
proj = "0.30"
# Direct FFI to a handful of libproj C functions (proj_create/proj_as_proj_string) not
# exposed by the `proj` crate's safe wrapper — needed to export an arbitrary CRS as a
# PROJ.4 string for the viewer's proj4js registration (see reproj::crs_to_proj4). Pinned to
# the exact version `proj = "0.27"` already pulls transitively (see Cargo.lock) so Cargo
# unifies it into the same build — no second libproj, no second `links = "proj"` conflict.
# Its own `bundled_proj` feature is NOT enabled here; `proj/bundled_proj` (below) remains
# the sole switch, so the Python wheel's vendored-PROJ build is untouched.
proj-sys = "=0.26.0"
weezl = "0.1"   # LZW codec (TIFF variant) — a codec crate like flate2/zune-jpeg, not a TIFF reader
zune-jpeg = "0.4"
zstd = "0.13"   # ZSTD codec (libzstd binding) — a codec crate like flate2/zune-jpeg, not a TIFF reader
image-webp = "0.2"   # WEBP codec (pure Rust, decode) — a codec crate like zune-jpeg, not a TIFF reader

# Async HTTP server. The request/I/O path is async; CPU render work is dispatched to a
# blocking worker pool (spawn_blocking) so it never stalls the reactor.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = "0.7"
# hyper/hyper-util: already transitive via axum. Pulled in directly so the serve loop can
# reach `http1().title_case_headers(true)` (axum::serve doesn't expose it) — HTTP plumbing,
# not a banned crate.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }

# Bounded, thread-safe decoded-tile cache with a hard memory cap (server-only). A cache
# util crate, not a COG/GeoTIFF reader — the container/tiling/warp stay bespoke.
moka = { version = "0.12", features = ["sync"] }

# Data-parallel batch tile decode across cores (per-tile independent, CPU-bound).
rayon = "1"

# SQLite bindings for GeoPackage (GPKG) container read. The "bundled" feature
# static-links SQLite from source — preserves the single-static-binary property.
rusqlite = { version = "0.31", features = ["bundled"] }

# S3 range-read I/O layer (cloud COGs). A sync HTTP client + hand-rolled SigV4 signing —
# generic S3 plumbing (works with OVH/AWS/any S3-compatible endpoint), NOT a COG reader.
# sha2/hmac are the standard crypto primitives the AWS SigV4 algorithm is defined in terms of.
ureq = "2"
sha2 = "0.10"
hmac = "0.12"

# Multi-layer server config (layers.yaml). Config parsing plumbing, not a differentiator.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Text shaping + glyph rasterization for the label engine. Text/font libs, NOT geo readers —
# the label PLACEMENT engine is the bespoke differentiator; shaping/AA is plumbing (like proj).
harfrust = "0.12.0"
swash = "0.2.9"
serde_json = "1.0.150"
roxmltree = "0.20"  # generic XML DOM for SLD parsing — the SLD interpretation is ours

# CPU rasterizer for polygon + line rendering. A rendering engine, not a geo reader —
# the vector rasterization/AA plumbing (like proj/harfrust); raster.rs uses this.
tiny-skia = "0.11"

# FlatBuffers runtime — codec, not a geo-format reader. The FlatGeoBuf container/Header/
# R-tree/Feature decode (src/vector/fgb/) is hand-written on top of this low-level Table API.
flatbuffers = "25"

# Postgres wire client + connection pool for the PostGIS vector source (src/vector/postgis.rs).
# A database CLIENT, exactly analogous to `rusqlite` for GeoPackage — not a geo-format reader:
# the geometry arrives as plain ISO WKB from `ST_AsBinary` and is decoded by our own
# `vector/wkb.rs`. Pure Rust (no libpq), so the static binary and the image size survive, and
# the binary wire protocol puts `bytea` straight into the decoder with no hex round trip.
# `deadpool` over `bb8` for its per-connection prepared-statement cache.
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
# `TryStreamExt` for consuming tokio-postgres's `RowStream` (query_raw) without buffering the
# result set. Present transitively already, but a transitive dependency is not importable.
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
# SIMD micro-benchmark only (examples/simd_bench.rs) — not used by the engine yet.
wide = "0.7"

[profile.release]
opt-level = 3
# MEASURED 2026-08-05 (bench/fgb_decode_bench.py, median of 3 runs per config), not assumed.
#
# The per-feature decode loop is dominated by tiny accessor calls into the `flatbuffers` CRATE
# (`Vector::get` per ordinate, `Table::get` per field). Without LTO the optimizer cannot see
# across that crate boundary, so each one stays an opaque call. `lto = "fat"` merges every
# crate's IR at link time, letting those accessors inline into our decode loops:
#
#   case                          none    lto=fat
#   z9 decode-only               2885ms   2664ms  -7.6 %
#   z8 decode-only               5770ms   5548ms  -3.8 %
#   z7 decode-only              11283ms  10310ms  -8.6 %
#   (all six cases improved; run-to-run spread is ~4-5 %, so the per-case delta is near the
#    noise floor, but 12/12 measurements across two configs favoured LTO.)
#
# `codegen-units = 1` was TRIED AND REJECTED: it measured within noise of lto=fat alone (and
# slightly worse on 5 of 6 cases) while pushing the build 1m04s -> 1m49s. Fat LTO already merges
# everything into one module at link time, which subsumes what CGU=1 buys. Do not re-add it
# without a measurement showing otherwise.
#
# NOT `panic = "abort"`: several decode paths carry a documented "never panics, always a clean
# Err" contract that the suite asserts by catching panics, and aborting turns those into a
# killed test process.
lto = "fat"
